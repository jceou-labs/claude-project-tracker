<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project tracker</title>
<style>
:root{
  --papier:#fbf9f3; --blanc:#ffffff; --encre:#1d1a22; --encre-2:#4b4654; --encre-3:#69636f;
  --violet:#6b2fb3; --violet-f:#4e1f86; --violet-p:#efe7f8; --violet-m:#c9b3e6;
  --foret:#9cc06a; --foret-f:#7aa64b; --ouvert:#f2c84b; --marais:#4a9ad6; --courbe:#b8763c;
  --filet:#e6e0d4; --filet-2:#efeae0; --toi:#b3135f;
  --cond:"Bahnschrift Condensed","Bahnschrift SemiCondensed","Arial Narrow",sans-serif;
  --demi:"Bahnschrift SemiCondensed","Bahnschrift",sans-serif;
  --texte:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
/* No scroll-padding on html: the sticky top bar fell inside it and the browser scrolled the page back up a notch
   on every click or selection in the bar. The margin is set on the link targets instead. */
html{scroll-behavior:smooth}
#haut,#attend{scroll-margin-top:80px}
body{margin:0;background:var(--papier);color:var(--encre);font:15px/1.55 var(--texte);font-variant-numeric:tabular-nums}
::selection{background:var(--violet-fond);color:#fff}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:var(--bord-fort);border-radius:8px;border:3px solid var(--papier)}::-webkit-scrollbar-track{background:var(--papier)}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0;text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
.cond{font-family:var(--cond);letter-spacing:.01em}
.maj{font-family:var(--demi);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* Top bar */
.barre{position:sticky;top:0;z-index:20;background:var(--barre-fond);backdrop-filter:blur(8px);border-bottom:1px solid var(--filet)}
.barre-in{margin:0 auto;padding:12px 40px;display:flex;align-items:center;gap:36px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--violet)}
.logo b{font:700 30px/1 var(--cond);letter-spacing:.02em}
.barre nav{display:flex;gap:28px}
.barre nav a{font:600 15px var(--demi);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;color:var(--encre);padding:8px 0;border-bottom:2px solid transparent}
.barre nav a:hover{color:var(--violet);border-color:var(--violet)}
.barre .droite{margin-left:auto;display:flex;align-items:center;gap:16px}
.barre select{font:600 15px var(--texte);color:var(--encre);background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:9px 14px;min-width:170px;box-shadow:0 1px 2px rgba(29,26,34,.06)}
.barre select:hover{border-color:var(--violet)}
.barre small{color:var(--encre-3);font-size:13px}
.barre .perime{color:var(--toi);font-weight:600}
.barre .retour{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--demi);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;color:var(--violet);border:2px solid var(--violet);border-radius:8px;padding:7px 12px;white-space:nowrap;transition:background .18s,color .18s}
.barre .retour:hover{background:var(--violet-fond);color:#fff}

/* Opening: what waits for you on the left, narrower terrain on the right */
.ouverture{position:relative;display:grid;grid-template-columns:minmax(0,clamp(560px,40vw,780px)) minmax(0,1fr);min-height:700px;border-bottom:2px solid var(--violet)}
.gauche{min-width:0;padding:48px 40px 36px;display:flex;flex-direction:column;position:relative;z-index:2}
.gauche h1{font:700 clamp(56px,5vw,96px)/.9 var(--cond);color:var(--violet);text-transform:uppercase;letter-spacing:-.005em}
.gauche h1 span{display:block}
.gauche .regle{height:2px;background:var(--violet-fond);margin:24px 0 18px;max-width:720px}
.gauche .resume{font-size:18px;line-height:1.5;max-width:58ch;color:var(--encre)}
.atoi{margin-top:22px;max-width:720px;background:var(--carte);border:1px solid var(--toi-bord);border-radius:12px;padding:16px 20px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;box-shadow:0 10px 26px rgba(179,19,95,.08),0 1px 3px rgba(40,24,70,.06)}
.atoi .num{grid-row:1 / 4;min-width:44px;height:44px;font-size:21px;margin-top:2px;padding:0 6px;border-radius:22px}
.atoi h2{font:700 27px/1.1 var(--cond);letter-spacing:.005em;color:var(--encre)}
.atoi h2 span{color:var(--toi)}
.atoi p{color:var(--encre-2);font-size:15px;max-width:62ch}
.atoi .meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font:600 13px var(--demi);color:var(--encre-2);text-transform:uppercase;letter-spacing:.05em}
.atoi .meta a{color:var(--toi)}
.cote-claude{margin-top:12px;font-size:16px;color:var(--encre-2);max-width:62ch;display:flex;gap:8px;align-items:flex-start}
.cote-claude svg{flex:none;margin-top:3px;color:var(--violet)}
.cote-claude b{color:var(--violet)}
.actions{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:12px;font:600 17px var(--demi);text-transform:uppercase;letter-spacing:.07em;text-decoration:none;border-radius:6px;padding:13px 22px;border:2px solid var(--violet);transition:background .18s,color .18s}
.btn.plein{background:var(--violet-fond);color:#fff}
.btn.plein:hover{background:var(--violet-f);border-color:var(--violet-f)}
.btn.vide{color:var(--encre);background:transparent}
.btn.vide:hover{background:var(--violet-p)}
.btn .nb{background:var(--toi-fond);color:#fff;border-radius:10px;font-size:13px;padding:1px 8px;letter-spacing:0}
.stats{margin-top:auto;padding-top:28px}
.stats-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--bord);border:1px solid var(--bord);border-radius:10px;overflow:hidden;max-width:720px}
.stats-in > div{display:flex;gap:10px;align-items:center;padding:14px;background:var(--carte-2);min-width:0}
.stats b{font:700 28px/1 var(--cond);color:var(--violet);display:block;white-space:nowrap}
.stats small{display:block;font:600 12px/1.3 var(--demi);text-transform:uppercase;letter-spacing:.05em;color:var(--encre-2)}
.stats small.plus{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--toi)}
.stats svg{flex:none;color:var(--encre)}

.terrain{position:relative;overflow:hidden;clip-path:polygon(8% 0,100% 0,100% 100%,0 100%);background:var(--terrain)}
.terrain svg.fond{position:absolute;inset:0;width:100%;height:100%}
/* Image background (field "fond" of projects/index.js): light veil so the markers stay readable */
.terrain .fond-image{position:absolute;inset:0;background:center/cover no-repeat}
.terrain .fond-image::after{content:"";position:absolute;inset:0;background:var(--voile)}
.terrain svg.parcours{position:absolute;inset:0;width:100%;height:100%}
.balise{cursor:pointer}
.balise circle.anneau{fill:var(--terrain);stroke:var(--violet);stroke-width:4}
.balise text{font:700 25px var(--cond);fill:var(--violet);paint-order:stroke;stroke:var(--terrain);stroke-width:5px}
.balise.usage circle.anneau{stroke-dasharray:7 6}
.balise.facultatif circle.anneau{stroke-dasharray:3 6;stroke-opacity:.7}
.balise.choisie circle.anneau{fill:var(--violet)}
.balise.attente.choisie circle.anneau{fill:var(--toi)}
.balise:hover circle.anneau,.balise:focus-visible circle.anneau{stroke-width:6}
.balise .mise{fill:none;stroke:var(--encre);stroke-width:2.5;stroke-dasharray:6 5;opacity:0}
.balise:focus-visible .mise{opacity:1}
.balise:focus{outline:none}
.pouls{fill:none;stroke:var(--violet);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pouls 2.2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes pouls{from{transform:scale(1);opacity:.75}to{transform:scale(1.9);opacity:0}}
.trace{fill:none;stroke:var(--violet);stroke-width:4;stroke-linecap:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:tracer 1.6s cubic-bezier(.16,1,.3,1) .2s forwards}
@keyframes tracer{to{stroke-dashoffset:0}}
.trace.fixe{animation:none;stroke-dashoffset:0}

.fiche{position:absolute;right:20px;top:24px;width:262px;background:var(--carte);border-radius:14px;box-shadow:0 18px 40px rgba(40,24,70,.18),0 2px 6px rgba(40,24,70,.08);padding:20px 22px;z-index:3}
.legende-carte{position:absolute;left:24px;right:20px;bottom:16px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--voile-fort);border:1px solid var(--filet);border-radius:10px;padding:8px 14px;font-size:13px;line-height:1.3;color:var(--encre-2)}
.legende-carte h3{font:600 12px var(--demi);text-transform:uppercase;letter-spacing:.07em;color:var(--encre-3)}
.legende-carte ul{list-style:none;margin:0;padding:0;display:contents}
.legende-carte li{display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.legende-carte svg{display:block;flex:none}
.fiche-tete{display:flex;gap:10px;align-items:center}
.num{display:inline-grid;place-items:center;min-width:34px;height:32px;border-radius:16px;background:var(--violet-fond);color:#fff;font:700 18px/1 var(--cond);padding:0 6px}
.fiche-tete h2{font:700 20px/1.15 var(--cond);text-transform:uppercase;letter-spacing:.02em}
.fiche .duree{font:700 40px/1 var(--cond);color:var(--violet);margin:14px 0 4px;text-align:center}
.fiche .unite{text-align:center;color:var(--encre-2);font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.07em}
.fiche .duo{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--filet);border-bottom:1px solid var(--filet);margin:14px 0;padding:10px 0}
.fiche .duo div{text-align:center}
.fiche .duo div + div{border-left:1px solid var(--filet)}
.fiche .duo b{display:block;font:700 19px/1.2 var(--cond);color:var(--violet)}
.fiche .duo small{display:block;margin-bottom:2px;font:600 12px var(--demi);text-transform:uppercase;letter-spacing:.07em;color:var(--encre-2)}
.fiche p{font-size:14px;color:var(--encre-2);min-height:42px}
.fiche .btn{width:100%;justify-content:center;margin-top:14px;padding:11px}
.fiche .partie{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--encre-3)}

/* Strip below the opening */
.trois{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr}
.trois > section{padding:28px 32px 32px}
.trois > section + section{border-left:1px solid var(--filet)}
.t-titre{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.t-titre h2{font:700 21px var(--cond);color:var(--violet);text-transform:uppercase;letter-spacing:.05em}
.t-titre{gap:16px;flex-wrap:wrap}
.t-titre span{font:600 13.5px var(--demi);color:var(--encre-2)}
.lignes{border:1px solid var(--filet);border-radius:10px;background:var(--carte);overflow:hidden}
.ligne{display:grid;grid-template-columns:40px 1fr auto 18px;gap:12px;align-items:center;padding:11px 14px;text-decoration:none;color:inherit}
.ligne + .ligne{border-top:1px solid var(--filet-2)}
.ligne:hover{background:var(--violet-p)}
.ligne b{font:600 17px/1.2 var(--cond);letter-spacing:.01em}
.ligne small{display:block;color:var(--encre-3);font-size:12.5px}
.ligne .val{font:600 14px var(--demi);color:var(--encre-2);white-space:nowrap}
.quand{display:inline-block;margin-right:8px;font:600 11.5px/1.7 var(--demi);text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:0 7px;vertical-align:1px}
.quand.maintenant{background:var(--toi-fond);color:#fff}
.quand.plustard{background:var(--filet-2);color:var(--encre-2)}
.pastille{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 16px/1 var(--cond);flex:none}
.pastille.carre{border-radius:7px}
.vide{color:var(--encre-3);font-size:14px;padding:14px}
.plat{border:1px solid var(--filet);border-radius:10px;background:var(--carte);padding:18px 20px}
.plat .etiquettes{display:flex;gap:12px;align-items:center;font:600 14px var(--demi);color:var(--encre-2)}
.etq{background:var(--violet-fond);color:#fff;font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:4px}
.plat h3{font:700 30px/1.1 var(--cond);margin:10px 0 4px}
.plat p{color:var(--encre-2);font-size:14px}

/* Parts */
main{max-width:1480px;margin:0 auto;padding:12px 40px 72px}
.partie{margin-top:56px;scroll-margin-top:80px}
.partie-tete{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;border-bottom:2px solid var(--encre);padding-bottom:12px}
.partie-tete .pastille{width:46px;height:46px;font-size:26px;border-radius:10px}
.partie-tete h2{font:700 46px/.95 var(--cond);text-transform:uppercase;letter-spacing:.005em}
.partie-tete .compte{margin-left:auto;text-align:right;font:600 14px var(--demi);color:var(--encre-2);text-transform:uppercase;letter-spacing:.05em}
.partie-tete .compte b{display:block;font:700 30px/1 var(--cond);color:var(--violet);letter-spacing:0}
.partie-but{color:var(--encre-2);font-size:16px;max-width:86ch;margin:12px 0 0}

/* Timeline: the part's course, stretch by stretch */
.frise{margin-top:22px;background:var(--carte);border:1px solid var(--filet);border-radius:12px;padding:16px 24px 14px;overflow-x:auto}
.frise-titre{display:flex;justify-content:space-between;align-items:baseline;font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.07em;color:var(--encre-3)}
/* One line per work item: number and name on the left, duration bar on the right, scaled to the part. */
.gantt{--gc:380px;min-width:900px;margin-top:10px}
.g-ligne{display:grid;grid-template-columns:var(--gc) minmax(0,1fr);min-height:36px;text-decoration:none;color:inherit;border-radius:6px}
.g-ligne + .g-ligne{box-shadow:0 -1px 0 var(--bord)}
a.g-ligne:hover,a.g-ligne:focus-visible{background:var(--violet-p)}
.g-gauche{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 14px 4px 4px}
.g-nom{flex:1 1 auto;min-width:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font:600 15px/1.2 var(--cond);letter-spacing:.01em}
.g-ligne.prochaine .g-nom{color:var(--violet)}
.g-att{flex:none;font:600 12px/1.6 var(--demi);color:var(--encre-2);background:var(--filet-2);border-radius:4px;padding:0 6px;white-space:nowrap}
.g-d{flex:none;min-width:46px;text-align:right;font:600 13px var(--demi);color:var(--violet);white-space:nowrap}
.g-ligne.attente .g-d{color:var(--toi)}
.g-piste{position:relative;border-left:2px dashed var(--violet-m);background:linear-gradient(90deg,var(--filet-2) 1px,transparent 1px) 0 0/var(--pas) 100%}
.g-barre,.ech{background:var(--violet-fond);border-radius:5px}
.g-barre{position:absolute;top:50%;height:10px;margin-top:-5px;min-width:8px}
.ech{display:inline-block;width:30px;height:10px}
.g-ligne.usage .g-barre,.ech.usage{background:repeating-linear-gradient(135deg,var(--violet) 0 3px,var(--violet-p2) 3px 7px)}
.g-ligne.attente .g-barre,.ech.attente{background:var(--toi-fond)}
.g-ligne.facultatif .g-barre,.ech.facultatif{background:var(--carte);border:2px dashed var(--violet-m)}
.g-ligne.inconnue .g-barre{-webkit-mask:linear-gradient(90deg,#000 45%,transparent);mask:linear-gradient(90deg,#000 45%,transparent)}
.g-ligne.incertain .g-barre,.ech.incertain{opacity:.4}
.g-pont,.ech.pont{height:0;border-top:2px dotted var(--gris-trait);background:none;border-radius:0}
.g-pont{position:absolute;top:50%;margin-top:-1px}
.g-faits .g-nom{font:600 13.5px var(--demi);color:var(--encre-2)}
.g-faits .pastille{width:24px;height:24px;background:var(--violet-m)}
.g-axe{min-height:24px}
.g-axe .g-piste{background:none;border-left-color:transparent}
.g-axe .g-piste span{position:absolute;top:5px;transform:translateX(-50%);font:600 12px var(--demi);color:var(--encre-3)}
.g-auj{justify-content:flex-end;gap:6px;font:600 12px var(--demi);color:var(--violet);text-transform:uppercase;letter-spacing:.06em}
.legende{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;padding-top:10px;border-top:1px solid var(--filet-2);font-size:13px;color:var(--encre-2)}
.legende span{display:inline-flex;align-items:center;gap:8px}

.colonnes{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-top:20px;align-items:start}
.bloc{background:var(--carte);border:1px solid var(--filet);border-radius:12px;padding:18px 22px}
.bloc h3{font:700 21px var(--cond);color:var(--violet);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.groupe{margin-top:14px}
.groupe:first-of-type{margin-top:0}
.groupe h4{font:600 12.5px var(--demi);text-transform:uppercase;letter-spacing:.08em;color:var(--encre-3);margin-bottom:4px}
.groupe ul{list-style:none;margin:0;padding:0}
.groupe li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--filet-2);align-items:start;font-size:14.5px}
.groupe li:first-child{border-top:0}
.coche{width:20px;height:20px;margin-top:1px;color:var(--violet)}
.ref{font:600 12.5px/1.6 var(--demi);color:var(--encre-2);white-space:nowrap}
.ecartes{margin-top:16px;padding-top:10px;border-top:1px dashed var(--bord-fort)}
.ecartes li{grid-template-columns:20px 1fr}
.ecartes .nom{text-decoration:line-through;color:var(--encre-2)}
.ecartes small{display:block;color:var(--encre-3);font-size:13px}
.rang{display:grid;grid-template-columns:40px 1fr auto;gap:4px 12px;padding:12px 10px;margin:0 -10px;border-top:1px solid var(--filet-2);border-radius:8px;scroll-margin-top:90px}
.rang:first-of-type{border-top:0}
.rang:target{background:var(--violet-p);box-shadow:inset 0 0 0 2px var(--violet-m)}
.rang b{font:600 18px/1.25 var(--cond);letter-spacing:.01em}
.rang .d{font:700 18px/1.2 var(--cond);color:var(--violet);text-align:right;white-space:nowrap}
.rang .d small{display:block;font:600 11px var(--demi);color:var(--encre-3);text-transform:uppercase;letter-spacing:.06em}
.rang p{grid-column:2 / 4;color:var(--encre-2);font-size:13.5px}
.rang .meta{grid-column:2 / 4;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.puce{font:600 12px/1.7 var(--demi);text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:0 7px}
.puce.prochaine{background:var(--violet-fond);color:#fff}
.puce.afaire{background:var(--violet-p);color:var(--violet-f)}
.puce.attente{background:var(--toi-p);color:var(--toi)}
.puce.usage{background:var(--bleu-p);color:var(--bleu)}
.puce.facultatif{border:1px dashed var(--gris-trait);color:var(--encre-3)}
.qui{font-size:13px;color:var(--encre-3);display:inline-flex;gap:5px;align-items:center}
.num.petit{min-width:28px;height:28px;font-size:15px}
.num.attente{background:var(--toi-fond)}
.num.creux{background:var(--carte);color:var(--violet);box-shadow:inset 0 0 0 2.5px var(--violet)}

.blocs{display:grid;gap:20px;margin-top:20px}
.note{color:var(--encre-2);font-size:14px;margin:-4px 0 12px;max-width:95ch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 12.5px var(--demi);text-transform:uppercase;letter-spacing:.07em;color:var(--encre-3);padding:8px 14px 8px 0;border-bottom:1px solid var(--filet)}
td{padding:9px 14px 9px 0;border-bottom:1px solid var(--filet-2);vertical-align:top}
td:first-child{font:600 16px var(--cond);white-space:nowrap;letter-spacing:.01em}
td:nth-child(2){white-space:nowrap;font:600 15px var(--cond);color:var(--violet)}
tbody tr:hover{background:var(--carte-2)}
.chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.chiffres > div{padding:6px 18px 4px 0}
.chiffres > div + div{padding-left:18px;border-left:1px solid var(--filet-2)}
.chiffres b{font:700 40px/1 var(--cond);color:var(--violet);display:block}
.chiffres p{font-size:13.5px;color:var(--encre-2);margin-top:6px}
.nature{display:inline-block;margin-top:8px;font:600 11.5px/1.7 var(--demi);text-transform:uppercase;letter-spacing:.07em;padding:0 7px;border-radius:4px}
.nature.mesure{background:var(--vert-p);color:var(--vert-f)}
.nature.estime{background:var(--ocre-p);color:var(--ocre)}

.pied{margin-top:64px;color:var(--encre-3);font-size:13px;border-top:1px solid var(--filet);padding-top:16px}
.alerte{margin:16px max(20px,calc((100% - 1400px) / 2)) 0;padding:14px 20px;background:var(--carte);border:1px solid var(--toi-bord);border-radius:10px;color:var(--encre)}
.alerte b{color:var(--toi);font-weight:600}
.alerte ul{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--encre-2)}
.erreur{max-width:70ch;margin:80px auto;padding:28px;background:var(--carte);border:1px solid var(--filet);border-radius:12px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.trace{stroke-dashoffset:0}}
@media (max-width:1279px){
  .ouverture{grid-template-columns:minmax(0,1fr)}
  .terrain{clip-path:none;padding-top:420px}
  .terrain svg.fond,.terrain svg.parcours,.terrain .fond-image{height:420px;bottom:auto}
  .fiche{position:relative;right:auto;top:auto;width:auto;max-width:560px;margin:16px 20px 12px}
  .legende-carte{position:static;margin:0 20px 20px}
  .legende-carte li{white-space:normal}
  .gauche{padding:32px 20px}.trois{grid-template-columns:minmax(0,1fr)}.trois > section + section{border-left:0;border-top:1px solid var(--filet)}
  .colonnes{grid-template-columns:minmax(0,1fr)}.barre-in{padding:10px 20px;gap:12px 16px;flex-wrap:wrap}.barre nav{gap:16px;overflow-x:auto;max-width:100%}
  .barre .droite{margin-left:0;flex-wrap:wrap}
  main{padding:8px 20px 56px}
}
@media (max-width:620px){
  .gantt{--gc:230px;min-width:640px}
  .stats-in{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trois > section{padding:24px 20px}
  .partie-tete h2{font-size:34px}
  .partie-tete .compte{margin-left:0;text-align:left}
  .atoi{padding:14px}
  .atoi h2{font-size:23px}
  .actions .btn{flex:1 1 auto;justify-content:center}
  .terrain{padding-top:330px}
  .terrain svg.fond,.terrain svg.parcours,.terrain .fond-image{height:330px}
}

<script src="projects/index.js"></script>
<script>
(function(){
  "use strict";
  var app = document.getElementById("app");
  var liste = window.SUIVI_LISTE || [];
  var id = new URLSearchParams(location.search).get("projet") || (liste[0] && liste[0].id);

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function ico(n, cls, t){ t = t || 18; return '<svg class="' + (cls || "") + '" width="' + t + '" height="' + t + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function nombre(x){ return String(Math.round(x * 10) / 10); }
  function demi(x){ return nombre(Math.round(x * 2) / 2); }
  function erreur(titre, texte){ app.innerHTML = '<div class="erreur"><h1 class="cond" style="font-size:34px;color:#6b2fb3">' + esc(titre) + '</h1><p style="margin-top:10px;color:#4b4654">' + texte + '</p></div>'; }

  function etat(v){ document.documentElement.setAttribute("data-suivi", v); } // read by the automatic check
  if (!id){ etat("vide"); erreur("No project to display", "Add a project in <code>projects/index.js</code> (see <code>README.md</code>)."); return; }
  if (!/^[a-z0-9_-]+$/i.test(id)){ etat("erreur"); erreur("Invalid project name", "The name in the address may only contain letters, digits and hyphens."); return; }
  // The data file lives in the project's folder (field "fichier" of projects/index.js);
  // without that field, the page looks for it in projects/ next to itself (examples, trials).
  var entree = liste.filter(function(x){ return x.id === id; })[0] || {};
  var chemin = entree.fichier || ("projects/" + id + ".js");
  var s = document.createElement("script");
  s.src = /^[a-z]:[\\\/]/i.test(chemin) ? "file:///" + encodeURI(chemin.replace(/\\/g, "/")) : chemin;
  s.onload = function(){
    var p = (window.SUIVI_PROJETS || {})[id];
    if (!p){ etat("erreur"); erreur("Project “" + id + "” is empty", "The file <code>" + esc(chemin) + "</code> loads but does not declare <code>window.SUIVI_PROJETS[\"" + esc(id) + "\"]</code>."); return; }
    var pbs = verifier(p);
    if (pbs.bloquant){ etat("erreur"); erreur("The project file is incomplete", esc(pbs.bloquant) + " File: <code>" + esc(chemin) + "</code>."); return; }
    try { rendre(p, pbs.liste); etat(pbs.liste.length ? "problemes:" + pbs.liste.length : "ok"); }
    catch (e){ etat("erreur"); erreur("The project file contains an error", "Technical message: “" + esc(e.message) + "”. Check <code>" + esc(chemin) + "</code>, or ask Claude to fix it."); }
  };
  s.onerror = function(){ etat("erreur"); erreur("File not found", "The page is looking for <code>" + esc(chemin) + "</code>. Check the path in <code>projects/index.js</code>, or create the file from <code>projects/_template.js</code>."); };
  document.head.appendChild(s);

  var ETATS_OK = ["fait", "prochaine", "afaire", "attente", "usage", "facultatif"], QUI_OK = ["claude", "toi", "ensemble"];
  // Data file check: a blocking problem stops the display, the others are shown at the top of the page.
  function verifier(p){
    var l = [];
    if (!p.nom) return { bloquant: "The project name is missing (“nom”)." };
    if (!Array.isArray(p.parties) || !p.parties.length) return { bloquant: "There must be at least one part in “parties”." };
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(p.majLe || "")) l.push("“majLe” must be a date dd/mm/yyyy.");
    if (!p.source) l.push("“source” is missing: where do these states come from (the project's files and commit)?");
    var ids = {}, codes = {}, tous = [];
    p.parties.forEach(function(pt, i){
      var nomPt = pt.nom || "part " + (i + 1);
      if (!pt.id || !pt.nom) l.push(nomPt + ": “id” or “nom” is missing.");
      if (!pt.code) l.push(nomPt + ": “code” is missing (one letter, which prefixes the marker numbers).");
      else if (codes[pt.code]) l.push(nomPt + ": the code “" + pt.code + "” is already used by another part."); else codes[pt.code] = 1;
      if (pt.couleur && !/^#[0-9a-f]{6}$/i.test(pt.couleur)) l.push(nomPt + ": “couleur” must look like #1a2b3c.");
      (pt.chantiers || []).forEach(function(c){ tous.push(c);
        var q = nomPt + ", work item “" + (c.nom || c.id || "?") + "”: ";
        if (!c.id || !c.nom) l.push(q + "“id” or “nom” is missing.");
        if (c.id && ids[c.id]) l.push(q + "the id “" + c.id + "” exists twice."); else if (c.id) ids[c.id] = 1;
        if (ETATS_OK.indexOf(c.etat) < 0) l.push(q + "unknown state “" + c.etat + "” (" + ETATS_OK.join(", ") + ").");
        if (c.etat === "fait") return;
        if (c.qui && QUI_OK.indexOf(c.qui) < 0) l.push(q + "“qui” must be claude, toi or ensemble.");
        var d = c.duree || c.jours;
        if (!d && !c.inconnue) l.push(q + "“duree”, “jours” or “inconnue: true” is required.");
        if (d && (!Array.isArray(d) || d.length !== 2 || !(d[0] > 0) || d[0] > d[1])) l.push(q + "the duration must be [min, max], with 0 < min ≤ max.");
      });
    });
    tous.forEach(function(c){ (c.apres || []).forEach(function(x){ if (!ids[x]) l.push("Work item “" + (c.nom || c.id) + "”: “apres” cites “" + x + "”, which does not exist."); }); });
    if (!tous.some(function(c){ return c.etat === "prochaine"; }) && tous.some(function(c){ return c.etat !== "fait"; })) l.push("No work item is marked “prochaine”: the page cannot say what Claude does next.");
    return { liste: l };
  }

  var ETAT = { prochaine:"Next marker", afaire:"To do", attente:"Waiting for your decision", usage:"Usage time", facultatif:"Optional", fait:"Cleared" };
  var NATURE = { "mesuré":"Measured", "estimé":"Estimated" }; // data values stay French; only the display is translated
  var QUI = { claude:["claude","Claude"], toi:["toi","You"], ensemble:["toi","You and Claude"] };

  function duree(c){
    if (c.duree) return { min:c.duree[0], max:c.duree[1], mil:(c.duree[0] + c.duree[1]) / 2, unite:"session" };
    if (c.jours) return { min:c.jours[0], max:c.jours[1], mil:(c.jours[0] + c.jours[1]) / 2, unite:"day" };
    return { min:3, max:3, mil:3, unite:"inconnue" };
  }
  function dureeCourte(c){
    var d = duree(c);
    if (d.unite === "inconnue") return { v:"?", u:"unknown duration" };
    var v = d.min === d.max ? nombre(d.min) : nombre(d.min) + "–" + nombre(d.max);
    if (d.max < 1) return { v:"< 1", u:"session" };
    return { v:v, u:d.unite + (d.max > 1 ? "s" : "") };
  }
  function texteDuree(c){ var x = dureeCourte(c); return x.v === "?" ? "unknown duration" : x.v.replace("–", " to ") + " " + x.u; }

  // A part's colour darkened until white text is readable on it (4.5:1 contrast).
  function fonce(hex){
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#4b4654";
    var n = parseInt(m[1], 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255];
    function lum(v){ return v.map(function(x){ x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); }).reduce(function(a, x, i){ return a + x * [.2126, .7152, .0722][i]; }, 0); }
    for (var i = 0; i < 20 && 1.05 / (lum(c) + .05) < 4.6; i++) c = c.map(function(x){ return Math.round(x * .92); });
    return "#" + c.map(function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
  }

  // Stable pseudo-random generator: the same project always gives the same terrain.
  function graine(txt){ var h = 2166136261; for (var i = 0; i < txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // Smooth closed outline around a centre: radius perturbed by a few sine waves.
  function contour(cx, cy, r, harm, n){
    n = n || 40; var pts = [];
    for (var i = 0; i < n; i++){
      var a = i / n * Math.PI * 2, k = 1;
      harm.forEach(function(h){ k += h[0] * Math.sin(h[1] * a + h[2]); });
      pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k * 0.82]);
    }
    var d = "";
    for (var j = 0; j < n; j++){
      var p0 = pts[(j - 1 + n) % n], p1 = pts[j], p2 = pts[(j + 1) % n], p3 = pts[(j + 2) % n];
      if (!j) d += "M" + p1[0].toFixed(1) + " " + p1[1].toFixed(1);
      d += "C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d + "Z";
  }

  function terrainSVG(nomProjet, L, H){
    var r = graine(nomProjet), o = [];
    o.push('<svg class="fond" viewBox="0 0 ' + L + ' ' + H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>');
    o.push('<pattern id="marais" width="10" height="7" patternUnits="userSpaceOnUse"><path d="M1 3.5h7" stroke="#4a9ad6" stroke-width="1.6" stroke-linecap="round"/></pattern>');
    o.push('<pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".7" fill="#5f8a35" opacity=".35"/></pattern></defs>');
    o.push('<rect width="' + L + '" height="' + H + '" fill="#fffdf7"/>');
    function harm(){ return [[0.18 + r() * 0.12, 2, r() * 6], [0.1 + r() * 0.08, 3, r() * 6], [0.05 + r() * 0.05, 5, r() * 6]]; }
    // Zones: dense forest (green), open ground (yellow), marsh (blue)
    for (var i = 0; i < 9; i++){ var g = harm(); var d = contour(r() * L, r() * H, 60 + r() * 120, g); o.push('<path d="' + d + '" fill="#a9c97a" opacity=".85"/><path d="' + d + '" fill="url(#grain)"/>'); }
    for (var y = 0; y < 4; y++){ o.push('<path d="' + contour(r() * L, r() * H, 50 + r() * 90, harm()) + '" fill="#f4cd57" opacity=".9"/>'); }
    for (var m = 0; m < 3; m++){ o.push('<path d="' + contour(r() * L, r() * H, 40 + r() * 70, harm()) + '" fill="url(#marais)"/>'); }
    // Contour lines: hills as nested rings
    for (var c = 0; c < 7; c++){
      var cx = r() * L, cy = r() * H, g2 = harm(), n = 4 + Math.floor(r() * 6);
      for (var k = 1; k <= n; k++) o.push('<path d="' + contour(cx, cy, k * (16 + r() * 4), g2) + '" fill="none" stroke="#b8763c" stroke-width="' + (k % 5 === 0 ? 1.8 : 1) + '" opacity=".7"/>');
    }
    // Dashed paths and rocks
    for (var t = 0; t < 4; t++){
      var x0 = r() * L, y0 = r() < .5 ? -10 : H + 10;
      o.push('<path d="M' + x0 + ' ' + y0 + 'C' + r() * L + ' ' + r() * H + ' ' + r() * L + ' ' + r() * H + ' ' + r() * L + ' ' + (y0 < 0 ? H + 10 : -10) + '" fill="none" stroke="#1d1a22" stroke-width="2" stroke-dasharray="9 6" opacity=".75"/>');
    }
    for (var b = 0; b < 40; b++) o.push('<circle cx="' + (r() * L).toFixed(0) + '" cy="' + (r() * H).toFixed(0) + '" r="' + (1.6 + r() * 2.4).toFixed(1) + '" fill="#1d1a22" opacity=".8"/>');
    o.push('</svg>');
    return o.join("");
  }

  // Map key: each marker shape, drawn as on the map.
  function legendeCarte(){
    function rond(attr, extra){ return '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' + (extra || "") + '<circle cx="12" cy="12" r="8" stroke-width="3" ' + attr + '/></svg>'; }
    var v = 'stroke="#6b2fb3"', blanc = 'fill="#fffdf7" ';
    var l = [
      [rond(blanc + v), "Purple: to do"],
      [rond(blanc + v, '<circle cx="12" cy="12" r="11" fill="none" stroke="#6b2fb3" stroke-width="1.6" opacity=".45"/>'), "Halo: Claude's next step"],
      [rond(blanc + 'stroke="#b3135f"'), "Pink: waiting for your decision or action"],
      [rond(blanc + v + ' stroke-dasharray="4 3"'), "Dashes: usage time (days)"],
      [rond(blanc + v + ' stroke-dasharray="1.6 3.4" stroke-opacity=".7"'), "Dots: optional"],
      [rond('fill="#6b2fb3" ' + v), "Filled: marker open in the card"],
      ['<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3z" fill="#fffdf7" stroke="#6b2fb3" stroke-width="3" stroke-linejoin="round"/></svg>', "Start: today"],
      ['<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#fffdf7" stroke="#6b2fb3" stroke-width="2.6"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#6b2fb3" stroke-width="2.6"/></svg>', "Finish"]
    ];
    return '<div class="legende-carte"><h3>Key</h3><ul>' + l.map(function(x){ return '<li>' + x[0] + '<span>' + x[1] + '</span></li>'; }).join("")
      + '<li><span><b style="color:var(--violet)">P1, A6…</b>: part letter, then start order</span></li></ul></div>';
  }

  function rendre(p, problemes){
    document.title = "Tracker · " + p.nom;
    var tous = {}, restants = [], faitsTous = [];
    p.parties.forEach(function(pt){ (pt.chantiers || []).forEach(function(c){ c._partie = pt; tous[c.id] = c; if (c.etat === "fait") faitsTous.push(c); else restants.push(c); }); });
    var debutCache = {};
    function debut(c, pile){
      if (debutCache[c.id] != null) return debutCache[c.id];
      pile = pile || {}; if (pile[c.id]) throw new Error("Loop in “apres” around " + c.id); pile[c.id] = 1;
      var d0 = 0;
      (c.apres || []).forEach(function(x){ var dep = tous[x]; if (dep && dep.etat !== "fait") d0 = Math.max(d0, debut(dep, pile) + duree(dep).mil); });
      return (debutCache[c.id] = d0);
    }

    // Start order: the work items that can start earliest first, optional ones last.
    function ordre(a, b){ var fa = a.etat === "facultatif", fb = b.etat === "facultatif"; if (fa !== fb) return fa ? 1 : -1; return debut(a) - debut(b); }
    // Marker number specific to each part: the part's letter then rank (M1, M2... T1... V1...).
    p.parties.forEach(function(pt){ restants.filter(function(c){ return c._partie === pt; }).sort(ordre).forEach(function(c, i){ c._n = (pt.code || "") + (i + 1); }); });
    // Map course: all parts mixed, in start order.
    var parcours = restants.slice().sort(function(a, b){ return ordre(a, b) || p.parties.indexOf(a._partie) - p.parties.indexOf(b._partie); });
    var prochaines = restants.filter(function(c){ return c.etat === "prochaine"; });
    // Dependencies not yet cleared; the latest one is the one that blocks.
    function enAttenteDe(c){ return (c.apres || []).map(function(x){ return tous[x]; }).filter(function(d){ return d && d.etat !== "fait"; }); }
    function bloquant(c){ return enAttenteDe(c).sort(function(a, b){ return (debut(b) + duree(b).mil) - (debut(a) + duree(a).mil); })[0] || null; }
    // Uncertain date: the work item waits, even indirectly, on a duration nobody can estimate.
    var incCache = {};
    function incertain(c){ if (incCache[c.id] != null) return incCache[c.id]; return (incCache[c.id] = enAttenteDe(c).some(function(d){ return duree(d).unite === "inconnue" || incertain(d); })); }
    var aToi = restants.filter(function(c){ return c.etat === "attente"; }).sort(function(a, b){ var pa = !enAttenteDe(a).length, pb = !enAttenteDe(b).length; if (pa !== pb) return pa ? -1 : 1; return debut(a) - debut(b); });
    var toiMaintenant = restants.filter(function(c){ return (c.qui === "toi" || c.qui === "ensemble") && c.etat !== "facultatif" && !enAttenteDe(c).length; })

        o.push('<a class="g-ligne ' + c.etat + (d.unite === "inconnue" ? " inconnue" : "") + (inc ? " incertain" : "") + '" href="#r-' + esc(c.id) + '" title="' + esc(etiq) + '" aria-label="' + esc(etiq) + '">'
          + '<span class="g-gauche"><span class="num petit' + cls + '">' + c._n + '</span><span class="g-nom">' + esc(c.nom) + '</span>' + att + '<span class="g-d">' + esc(dc.v + (dc.v === "?" ? "" : " " + dc.u.charAt(0))) + '</span></span>'
          + '<span class="g-piste"' + grille + '>' + pont + '<span class="g-barre" style="left:' + pc(x) + ';width:' + pc(d.mil) + '"></span></span></a>');
      });
      o.push('<div class="g-ligne g-axe" aria-hidden="true"><span class="g-gauche g-auj">Today' + ico("depart", "", 16) + '</span><span class="g-piste">');
      for (var t = pas; t <= tot; t += pas) o.push('<span style="left:' + pc(t) + '">+' + t + '</span>');
      o.push('</span></div></div><div class="legende"><span><i class="ech"></i>Work (sessions)</span><span><i class="ech usage"></i>Usage or waiting (days)</span><span><i class="ech attente"></i>Waiting for your decision</span><span><i class="ech facultatif"></i>Optional</span><span><i class="ech incertain"></i>Pale: uncertain date (after an unknown duration)</span><span><i class="ech pont"></i>Waiting on another part</span><span>“s” = sessions, “d” = days, “?” = unknown duration</span></div></div>');

      // Still to do on the left, done on the right
      o.push('<div class="colonnes"><div class="bloc"><h3>Still to do, in order</h3>');
      if (!rest.length) o.push('<p class="vide" style="padding:0">Everything in this part is cleared.</p>');
      rest.forEach(function(c){
        var dc = dureeCourte(c), q = QUI[c.qui];
        o.push('<div class="rang" id="r-' + esc(c.id) + '"><span class="num petit' + (c.etat === "attente" ? " attente" : c.etat === "prochaine" ? "" : " creux") + '">' + c._n + '</span><b>' + esc(c.nom) + '</b><span class="d">' + esc(dc.v) + '<small>' + esc(dc.u) + '</small></span>');
        o.push('<span class="meta"><span class="puce ' + c.etat + '">' + esc(ETAT[c.etat]) + '</span>' + (q ? '<span class="qui">' + ico(q[0], "", 16) + esc(q[1]) + '</span>' : '') + (incertain(c) ? '<span class="qui">uncertain date: after an unknown duration</span>' : '') + '</span>');
        if (c.detail) o.push('<p>' + esc(c.detail) + '</p>');
        o.push('</div>');
      });
      o.push('</div><div class="bloc"><h3>Done</h3>');
      var groupes = [], parG = {};
      (pt.fonctions || []).forEach(function(f){ var g = f.groupe || "Features"; if (!parG[g]){ parG[g] = []; groupes.push(g); } parG[g].push(f); });
      if (!groupes.length) o.push('<p class="vide" style="padding:0">Nothing delivered yet.</p>');
      groupes.forEach(function(g){
        o.push('<div class="groupe"><h4>' + esc(g) + '</h4><ul>');
        parG[g].forEach(function(f){ o.push('<li>' + ico("ok", "coche", 20) + '<span>' + esc(f.nom) + '</span><span class="ref">' + esc([f.ref, f.date].filter(Boolean).join(" · ")) + '</span></li>'); });
        o.push('</ul></div>');
      });
      if ((pt.ecartes || []).length){
        o.push('<div class="ecartes groupe"><h4>Deliberately set aside</h4><ul>');
        pt.ecartes.forEach(function(e){ o.push('<li>' + ico("barre", "coche", 20) + '<span><span class="nom">' + esc(e.nom) + '</span><small>' + esc(e.raison) + '</small></span></li>'); });
        o.push('</ul></div>');
      }
      o.push('</div></div>');

      if ((pt.blocs || []).length){
        o.push('<div class="blocs">');
        pt.blocs.forEach(function(b){
          o.push('<div class="bloc"><h3>' + esc(b.titre) + '</h3>' + (b.note ? '<p class="note">' + esc(b.note) + '</p>' : ''));
          if (b.type === "tableau"){
            o.push('<div style="overflow-x:auto"><table><thead><tr>'); b.colonnes.forEach(function(c){ o.push('<th scope="col">' + esc(c) + '</th>'); }); o.push('</tr></thead><tbody>');
            b.lignes.forEach(function(l){ o.push('<tr>' + l.map(function(v){ return '<td>' + esc(v) + '</td>'; }).join("") + '</tr>'); });
            o.push('</tbody></table></div>');
          } else if (b.type === "chiffres"){
            o.push('<div class="chiffres">'); b.elements.forEach(function(e){ var m = e.nature === "mesuré"; o.push('<div><b>' + esc(e.valeur) + '</b><p>' + esc(e.libelle) + '</p><span class="nature ' + (m ? "mesure" : "estime") + '">' + esc(NATURE[e.nature] || e.nature) + '</span></div>'); }); o.push('</div>');
          } else if (b.type === "texte"){ o.push('<p style="max-width:75ch">' + esc(b.texte) + '</p>'); }
          o.push('</div>');
        });
        o.push('</div>');
      }
      o.push('</section>');
      return o.join("");
    }
  }

})();
</script>
</body>
</html>
