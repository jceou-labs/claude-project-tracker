<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All projects · tracker</title>
<style>
/* Overview: same world as index.html (paper, purple, Bahnschrift, magenta for what waits for you).
   One line per project, readable in five seconds: progress, status, what Claude is doing, what waits for you.
   The page's signature: each project's course, one stretch per part, filled in as work items are done. */
:root{
  --papier:#fbf9f3; --blanc:#ffffff; --encre:#1d1a22; --encre-2:#4b4654; --encre-3:#69636f;
  --violet:#6b2fb3; --violet-f:#4e1f86; --violet-p:#efe7f8; --violet-m:#c9b3e6;
  --filet:#e6e0d4; --filet-2:#efeae0; --toi:#b3135f; --toi-p:#fbe6ef; --vert:#2f6b1f; --vert-p:#e3f0d8;
  --cond:"Bahnschrift Condensed","Bahnschrift SemiCondensed","Arial Narrow",sans-serif;
  --demi:"Bahnschrift SemiCondensed","Bahnschrift",sans-serif;
  --texte:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
#projets,#attend,#hors{scroll-margin-top:84px}
body{margin:0;background:var(--papier);color:var(--encre);font:15px/1.55 var(--texte);font-variant-numeric:tabular-nums}
::selection{background:var(--violet-fond);color:#fff}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-thumb{background:var(--bord-fort);border-radius:8px;border:3px solid var(--papier)}::-webkit-scrollbar-track{background:var(--papier)}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
p{margin:0;text-wrap:pretty}

/* Top bar, identical to a project's page */
.barre{position:sticky;top:0;z-index:20;background:var(--barre-fond);backdrop-filter:blur(8px);border-bottom:1px solid var(--filet)}
.barre-in{margin:0 auto;padding:12px 40px;display:flex;align-items:center;gap:36px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--violet)}
.logo b{font:700 30px/1 var(--cond);letter-spacing:.02em}
.barre nav{display:flex;gap:28px}
.barre nav a{font:600 15px var(--demi);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;color:var(--encre);padding:8px 0;border-bottom:2px solid transparent}
.barre nav a:hover{color:var(--violet);border-color:var(--violet)}
.barre .droite{margin-left:auto;display:flex;align-items:center;gap:16px}
.barre small{color:var(--encre-3);font-size:13px}
.barre select{font:600 15px var(--texte);color:var(--encre);background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:9px 14px;min-width:170px;box-shadow:0 1px 2px rgba(29,26,34,.06)}
.barre select:hover{border-color:var(--violet)}

main{margin:0 auto;padding:0 40px 72px}

/* Opening */
.ouverture{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 48px;align-items:end;padding:48px 0 28px;border-bottom:2px solid var(--violet)}
.ouverture h1{font:700 clamp(56px,5vw,96px)/.9 var(--cond);color:var(--violet);text-transform:uppercase;letter-spacing:-.005em}
.ouverture h1 span{display:block}
.ouverture .resume{margin-top:18px;font-size:18px;max-width:62ch}
.ouverture .resume b{font-weight:600}
.ouverture .resume .t{color:var(--toi);font-weight:600}
.bilan{display:grid;grid-template-columns:repeat(3,auto);gap:1px;background:var(--bord);border:1px solid var(--bord);border-radius:10px;overflow:hidden}
.bilan > div{background:var(--carte-2);padding:14px 20px;min-width:150px}
.bilan b{display:block;font:700 34px/1 var(--cond);color:var(--violet);white-space:nowrap}
.bilan b.t{color:var(--toi)}
.bilan small{display:block;margin-top:4px;font:600 12px/1.3 var(--demi);text-transform:uppercase;letter-spacing:.05em;color:var(--encre-2)}
.bilan em{display:block;margin-top:6px;font:600 13px/1.25 var(--demi);font-style:normal;color:var(--encre-3);white-space:nowrap}
.bilan em .plus-v{color:var(--vert)} .bilan em .plus-t{color:var(--toi)}

/* Pace: work items done each day, all projects, under the summary */
.cote{display:grid;gap:12px;min-width:0}
.rythme{background:var(--carte-2);border:1px solid var(--bord);border-radius:10px;padding:14px 18px 10px}
.rythme-tete{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.rythme-tete h2{font:600 12px/1.3 var(--demi);text-transform:uppercase;letter-spacing:.05em;color:var(--encre-2)}
.rythme-tete p{font-size:13px;color:var(--encre-2)}
.rythme-tete p b{font:700 17px/1 var(--cond);color:var(--violet)}
.rythme-tete p .vite{color:var(--vert);font-weight:600}
.rythme-tete p .lent{color:var(--toi);font-weight:600}
.barres{display:flex;align-items:flex-end;gap:3px;height:86px;margin-top:10px;padding-top:16px;border-bottom:1px solid var(--bord)}
.barres span{flex:1 1 0;position:relative;min-width:0;background:var(--violet-m);border-radius:3px 3px 0 0;min-height:0}
.barres span.recent{background:var(--violet-fond)}
.barres span.vide{background:transparent}
.barres span b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;font:600 11px/1 var(--demi);color:var(--encre-2)}
.barres span.recent b{color:var(--violet-f)}
.barres span:hover{filter:brightness(1.12)}
.axe{display:flex;justify-content:space-between;margin-top:5px;font:600 11.5px/1.2 var(--demi);color:var(--encre-3)}
.axe span:nth-child(2){color:var(--violet-f)}
.rythme .vide-txt{margin-top:8px;font-size:13px;color:var(--encre-3)}

/* Section titles */
.sec{margin-top:44px}
.sec-tete{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--encre);padding-bottom:10px}
.sec-tete h2{font:700 38px/.95 var(--cond);text-transform:uppercase}
.sec-tete p{color:var(--encre-2);font-size:14.5px}
.tri{display:flex;gap:6px;align-items:center;font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.06em;color:var(--encre-3)}
.tri button{font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.06em;color:var(--encre);background:var(--carte);border:1px solid var(--bord);border-radius:6px;padding:6px 11px;cursor:pointer}
.tri button:hover{border-color:var(--violet)}
.tri button[aria-pressed="true"]{background:var(--violet-fond);border-color:var(--violet);color:#fff}

/* One line per project */
.projets{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.projet{display:grid;grid-template-columns:112px minmax(0,1.05fr) minmax(0,1.3fr) 124px minmax(0,1fr) 220px;grid-template-areas:"vig ident parc avance suite rythme";gap:0 28px;align-items:center;padding:14px 22px 14px 14px;background:var(--carte);border:1px solid var(--filet);border-radius:12px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(40,24,70,.04);transition:box-shadow .2s,border-color .2s}
a.projet:hover{border-color:var(--violet-m);box-shadow:0 12px 28px rgba(40,24,70,.10),0 2px 4px rgba(40,24,70,.05)}
.vignette{grid-area:vig;width:112px;height:84px;border-radius:8px;background:var(--violet-p) center/cover no-repeat;display:grid;place-items:center;font:700 34px/1 var(--cond);color:var(--violet);position:relative;overflow:hidden}
.vignette::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(29,26,34,.08);border-radius:8px}
.ident{grid-area:ident;min-width:0}
.ident h3{font:700 25px/1.05 var(--cond);letter-spacing:.005em}
.ident p{margin-top:4px;font-size:13.5px;color:var(--encre-2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ident .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--encre-3)}
.statut{font:600 12px/1.75 var(--demi);text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:0 8px;white-space:nowrap}
.statut.cours{background:var(--violet-fond);color:#fff}
.statut.toi{background:var(--toi-fond);color:#fff}
.statut.attente{background:var(--filet-2);color:var(--encre-2)}
.statut.fini{background:var(--vert-p);color:var(--vert)}
.statut.erreur{background:var(--carte);color:var(--toi);box-shadow:inset 0 0 0 1.5px var(--toi)}
.perime{color:var(--toi);font-weight:600}

/* The course: one stretch per part, width proportional to its number of work items */
.parcours{grid-area:parc;display:flex;gap:16px;min-width:0}
.troncon{flex:1 1 70px;min-width:70px}
.troncon .lib{display:flex;justify-content:space-between;gap:6px;font:600 12px/1.2 var(--demi);color:var(--encre-2);white-space:nowrap;overflow:hidden}
.troncon .lib span:first-child{overflow:hidden;text-overflow:ellipsis}
.troncon .lib b{font-weight:600;color:var(--encre-3)}
.piste{position:relative;margin-top:6px;height:12px;border-radius:6px;background:var(--filet-2);box-shadow:inset 0 0 0 1px var(--bord)}
.piste i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--c,var(--violet))}
.piste .balise{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--carte);box-shadow:0 0 0 3px var(--violet),0 2px 6px rgba(40,24,70,.25)}
.piste .balise::after{content:"";position:absolute;inset:-3px;border-radius:50%;box-shadow:0 0 0 3px var(--violet);animation:pouls 2.2s cubic-bezier(.16,1,.3,1) infinite}
@keyframes pouls{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
.parcours-vide{grid-area:parc;font-size:13px;color:var(--encre-3)}

.avance{grid-area:avance;text-align:right}
.avance b{display:block;font:700 46px/.9 var(--cond);color:var(--violet)}
.avance b small{font-size:24px}
.avance span{display:block;margin-top:4px;font:600 12px/1.3 var(--demi);text-transform:uppercase;letter-spacing:.05em;color:var(--encre-2)}
.rythme-pj{grid-area:rythme;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-left:24px;border-left:1px solid var(--filet-2);min-width:0}
.rythme-pj .rt{display:flex;justify-content:space-between;align-items:baseline;font:600 11.5px/1.2 var(--demi);text-transform:uppercase;letter-spacing:.06em;color:var(--encre-3)}
.mini{display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:6px;padding-top:14px;border-bottom:1px solid var(--bord)}
.mini i{flex:1 1 0;min-width:0;position:relative;background:var(--violet-m);border-radius:2px 2px 0 0;font-style:normal}
.mini i.recent{background:var(--violet-fond)}
.mini i.zero{background:transparent}
.mini i b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:2px;font:600 10.5px/1 var(--demi);color:var(--encre-3)}
.mini i.recent b{color:var(--violet-f)}
.rythme-pj .vit{margin-top:6px;font:600 13px/1.25 var(--demi);color:var(--encre-3);white-space:nowrap}
.rythme-pj .vit b{font:700 18px/1 var(--cond);color:var(--violet)}
.rythme-pj .vit .vite{color:var(--vert)} .rythme-pj .vit .lent{color:var(--toi)}

.suite{grid-area:suite;min-width:0;display:grid;gap:7px;font-size:13.5px;line-height:1.35}
.suite div{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.suite svg{margin-top:1px}
.suite .claude{color:var(--violet)}
.suite .moi{color:var(--toi)}
.suite .txt{color:var(--encre);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.suite .txt em{font-style:normal;color:var(--encre-3)}

/* What waits for you */
.attend{margin-top:18px;border:1px solid var(--filet);border-radius:12px;background:var(--carte);overflow:hidden}
.att{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:4px 18px;align-items:baseline;padding:12px 18px;text-decoration:none;color:inherit}
.att + .att{border-top:1px solid var(--filet-2)}
a.att:hover{background:var(--toi-p)}
.att .pj{font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.05em;color:var(--toi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att b{font:600 17px/1.25 var(--cond);letter-spacing:.01em}
.att p{grid-column:2;font-size:13px;color:var(--encre-2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
.att .d{font:600 13.5px var(--demi);color:var(--encre-2);white-space:nowrap;text-align:right}
.att .ens{font:600 11.5px/1.7 var(--demi);text-transform:uppercase;letter-spacing:.06em;background:var(--violet-p);color:var(--violet-f);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:2px}
.plus{display:block;width:100%;padding:11px 18px;border:0;border-top:1px solid var(--filet-2);background:var(--carte-2);font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.06em;color:var(--violet);text-align:left;cursor:pointer}
.plus:hover{background:var(--violet-p)}

/* Without a tracking page */
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px;background:var(--carte);border:1px solid var(--filet);border-radius:12px;overflow:hidden}
th{text-align:left;font:600 12.5px var(--demi);text-transform:uppercase;letter-spacing:.07em;color:var(--encre-3);padding:10px 16px;border-bottom:1px solid var(--filet);background:var(--carte-2)}
td{padding:10px 16px;border-bottom:1px solid var(--filet-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{font:600 17px/1.2 var(--cond);letter-spacing:.01em;white-space:nowrap}
td.date{white-space:nowrap;color:var(--encre-3)}
td .statut{display:inline-block}

.note{margin-top:10px;color:var(--encre-3);font-size:13px;max-width:100ch}
.pied{margin-top:56px;color:var(--encre-3);font-size:13px;border-top:1px solid var(--filet);padding-top:16px;max-width:110ch}
.pied code{font-size:12.5px}
.chargement{padding:60px 0;color:var(--encre-3);font:600 15px var(--demi);text-transform:uppercase;letter-spacing:.07em}

/* Arranging the list: hand order, sorts, separators (kept by the browser) */
.sec-outils{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.tri{flex-wrap:wrap}
.ajout-sep{display:inline-flex;align-items:center;gap:7px;font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.06em;color:var(--violet);background:transparent;border:1px dashed var(--violet-m);border-radius:6px;padding:6px 12px 6px 9px;cursor:pointer;transition:background .15s,border-color .15s}
.ajout-sep:hover{background:var(--violet-p);border-style:solid;border-color:var(--violet)}
.aide{margin-top:10px;font-size:13px;color:var(--encre-3)}
.aide kbd{font:600 11.5px/1.5 var(--demi);border:1px solid var(--bord);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--carte);color:var(--encre-2)}
.projets{position:relative}
.projets > li{position:relative}
.projets > li.cache{display:none}
.projet{transition:box-shadow .2s,border-color .2s,transform .18s}
.rangeable > li{-webkit-user-select:none;user-select:none}
.poignee{position:absolute;left:-30px;top:50%;width:22px;height:40px;margin-top:-20px;display:grid;place-items:center;color:var(--encre-3);border-radius:6px;opacity:0;cursor:grab;touch-action:none;transition:opacity .15s,color .15s,background .15s}
.rangeable > li:hover > .poignee,.rangeable > li:focus-within > .poignee{opacity:1}
.poignee:hover{color:var(--violet);background:var(--violet-p)}
.rangeable .sep-in{cursor:grab}
body.en-glisse,body.en-glisse *{cursor:grabbing!important}
body.en-glisse .projets > li{pointer-events:none}
.projets > li.leve{position:fixed;z-index:60;margin:0!important;pointer-events:none}
.projets > li.leve.pose{transition:top .18s cubic-bezier(.2,.7,.2,1)}
.leve > a.projet,.leve > .sep-in{transform:rotate(-.5deg) scale(1.012);border-color:var(--violet);box-shadow:0 26px 50px rgba(40,24,70,.24),0 4px 10px rgba(40,24,70,.12)}
.leve > .sep-in{background:var(--carte);border-color:var(--c)}
.leve.pose > a.projet,.leve.pose > .sep-in{transform:none}
.leve > .poignee{opacity:1;color:var(--violet)}
.trou{border:2px dashed var(--violet-m);border-radius:12px;background:var(--violet-p);opacity:.55}
.trou.trou-sep{margin-top:22px}
.projets > li.vient > a.projet,.projets > li.vient > .sep-in{animation:vient 1.1s cubic-bezier(.16,1,.3,1)}
@keyframes vient{from{box-shadow:0 0 0 3px var(--violet),0 10px 26px rgba(40,24,70,.18)}to{box-shadow:0 0 0 0 transparent}}

/* A separator: name in large capitals, a rule that fills up with the group's progress */
.projets > li.sep{margin-top:22px}
.projets > li.sep:first-child{margin-top:0}
.sep-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 12px 10px 8px;border:1px solid transparent;border-radius:12px;background:color-mix(in srgb,var(--cp) 75%,transparent);transition:box-shadow .2s,border-color .2s,transform .18s}
.sep.auto .sep-in{padding-left:16px}
.sep-nom{font:700 30px/1 var(--cond);text-transform:uppercase;letter-spacing:.01em;color:var(--c);min-width:0;overflow-wrap:anywhere}
.sep-compte{font:600 12px/1.2 var(--demi);text-transform:uppercase;letter-spacing:.07em;color:var(--encre-2);white-space:nowrap}
.sep-regle{flex:1 1 120px;min-width:80px;height:6px;border-radius:3px;position:relative;overflow:hidden;background:color-mix(in srgb,var(--c) 20%,transparent)}
.sep-regle i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c)}
.sep-regle.vide{background:none;height:0;border-top:2px dashed color-mix(in srgb,var(--c) 35%,transparent);border-radius:0}
.sep-stats{font:600 13px/1 var(--demi);color:var(--encre-2);white-space:nowrap}
.sep-stats b{font:700 26px/1 var(--cond);color:var(--c)}
.sep-stats .t{color:var(--toi)}
.sep-pile{display:flex;padding-left:10px}
.sep-pile span{width:36px;height:27px;margin-left:-10px;border-radius:6px;border:2px solid var(--papier);background:var(--violet-p) center/cover no-repeat;font:700 12px/23px var(--cond);text-align:center;color:var(--violet)}
.sep-outils{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.sep:hover .sep-outils,.sep:focus-within .sep-outils{opacity:1}
.sep-btn{width:34px;height:34px;flex:none;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--encre-2);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.sep-btn:hover{background:var(--carte);border-color:var(--bord);color:var(--c)}
.sep-btn.suppr:hover{color:var(--toi);border-color:var(--toi-bord)}
.sep-plier{color:var(--c)}
.sep-plier svg{transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.sep.plie .sep-plier svg{transform:rotate(-90deg)}
.pastille{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--carte),0 0 0 3.5px var(--c)}
.sep-champ{font:inherit;letter-spacing:inherit;text-transform:uppercase;color:inherit;background:var(--carte);border:0;border-bottom:2px solid var(--c);border-radius:6px 6px 0 0;padding:2px 8px;width:min(20ch,62vw);outline:none}
@media (hover:none){.poignee{opacity:.7}.sep-outils{opacity:1}}

/* Message at the bottom of the screen (undo a deletion) */
.toast{position:fixed;left:50%;bottom:24px;z-index:80;display:flex;align-items:center;gap:16px;max-width:calc(100vw - 32px);padding:11px 12px 11px 18px;border-radius:12px;background:var(--encre);color:var(--papier);font-size:14px;box-shadow:0 18px 40px rgba(29,26,34,.28);opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:opacity .2s,transform .2s cubic-bezier(.2,.7,.2,1)}
.toast.vu{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast button{flex:none;font:600 13px var(--demi);text-transform:uppercase;letter-spacing:.06em;color:inherit;background:transparent;border:1px solid currentColor;border-radius:6px;padding:5px 10px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:1279px){
  .barre-in{padding:10px 20px;gap:12px 18px;flex-wrap:wrap}
  .barre nav{gap:16px;overflow-x:auto;max-width:100%}
  .barre .droite{margin-left:0;flex-wrap:wrap}
  main{padding:0 20px 56px}
  .ouverture{grid-template-columns:minmax(0,1fr)}

<script>
(function(){
  "use strict";
  var app = document.getElementById("app");
  var liste = window.SUIVI_LISTE || [];
  var hors = window.SUIVI_HORS || { majLe: "", projets: [] };
  var TRI_CLE = "suivi-ensemble-tri";

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function ico(n, t){ t = t || 18; return '<svg width="' + t + '" height="' + t + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function nombre(x){ return String(Math.round(x * 10) / 10); }
  function demi(x){ return nombre(Math.round(x * 2) / 2); }
  function lien(id){ return "index.html?projet=" + encodeURIComponent(id); }
  function etat(v){ document.documentElement.setAttribute("data-suivi", v); } // read by an automatic check

  var auj = new Date();
  document.getElementById("auj").textContent = "As of " + auj.toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" });

  if (window.suiviBoutonTheme) document.getElementById("theme-ici").innerHTML = suiviBoutonTheme();
  var sel = document.getElementById("ouvrir");
  liste.forEach(function(x){ var o = document.createElement("option"); o.value = x.id; o.textContent = x.nom; sel.appendChild(o); });
  sel.addEventListener("change", function(){ if (sel.value) location.href = lien(sel.value); });

  // Loads each project's suivi.js file, like a project's page does (script tag, works over file://).
  // Started at the very end of the script, once everything is in place (a failed load can answer right away).
  var restants = liste.length, erreurs = {};
  function charger(){
  if (!restants) { fini(); return; }
  liste.forEach(function(x){
    var chemin = x.fichier || ("projects/" + x.id + ".js");
    var s = document.createElement("script");
    s.src = /^[a-z]:[\\\/]/i.test(chemin) ? "file:///" + encodeURI(chemin.replace(/\\/g, "/")) : chemin;
    s.onload = function(){ if (!(window.SUIVI_PROJETS || {})[x.id]) erreurs[x.id] = "The file loads but does not declare this project."; un(); };
    s.onerror = function(){ erreurs[x.id] = "File not found: " + chemin; un(); };
    document.head.appendChild(s);
  });
  }
  function un(){ if (--restants === 0) fini(); }

  // Pace: a finished work item counts on the day of its "date" (dd/mm or dd/mm/yyyy). Without a year: the current year,
  // or the previous one if the date would fall in the future.
  var JOURS_RYTHME = 21, JOURS_MINI = 14, HISTO_CLE = "suivi-ensemble-historique-v1";
  function cle(d){ return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function ilYa(n){ var d = new Date(auj.getFullYear(), auj.getMonth(), auj.getDate()); d.setDate(d.getDate() - n); return d; }
  function jourChantier(txt){
    var m = /^\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\s*$/.exec(txt || ""); if (!m) return null;
    var an = m[3] ? +m[3] : auj.getFullYear(), d = new Date(an, +m[2] - 1, +m[1]);
    if (!m[3] && d > auj) d = new Date(an - 1, +m[2] - 1, +m[1]);
    return isNaN(d) ? null : cle(d);
  }
  function jj(k){ return k.slice(8, 10) + "/" + k.slice(5, 7); }
  function nbJours(r, debut, fin){ var n = 0; for (var i = debut; i < fin; i++) n += r.parJour[cle(ilYa(i))] || 0; return n; }

  function dateFr(txt){ var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt || ""); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; }

  // Everything displayed is computed from the file's work items: nothing is entered by hand for a tracked project.
  function analyser(entree){
    var p = (window.SUIVI_PROJETS || {})[entree.id];
    var r = { id: entree.id, nom: entree.nom, fond: entree.fond, erreur: erreurs[entree.id] };
    if (!p || r.erreur || !Array.isArray(p.parties)) { r.erreur = r.erreur || "Incomplete file (“parties” missing)."; return r; }
    r.nom = entree.nom || p.nom; r.resume = p.resume || ""; r.majLe = p.majLe || "";
    var d = dateFr(p.majLe); r.age = d ? Math.floor((auj - d) / 864e5) : null;
    var tous = {}, liste = [];
    p.parties.forEach(function(pt){ (pt.chantiers || []).forEach(function(c){ if (c && c.id) tous[c.id] = c; liste.push({ c: c, pt: pt }); }); });
    function libre(c){ return (c.apres || []).every(function(x){ return !tous[x] || tous[x].etat === "fait"; }); }
    var utiles = liste.filter(function(x){ return x.c.etat !== "facultatif"; });
    var faits = utiles.filter(function(x){ return x.c.etat === "fait"; });
    var reste = utiles.filter(function(x){ return x.c.etat !== "fait"; });
    r.total = utiles.length; r.faits = faits.length;
    r.parJour = {}; r.sansDate = 0;
    faits.forEach(function(x){ var k = jourChantier(x.c.date); if (k) r.parJour[k] = (r.parJour[k] || 0) + 1; else r.sansDate++; });
    r.sem = nbJours(r, 0, 7); r.semAvant = nbJours(r, 7, 14);
    r.pct = r.total ? Math.round(r.faits / r.total * 100) : 0;
    r.parties = p.parties.map(function(pt){
      var u = (pt.chantiers || []).filter(function(c){ return c.etat !== "facultatif"; });
      var f = u.filter(function(c){ return c.etat === "fait"; }).length;
      return { nom: pt.nomCourt || pt.nom, code: pt.code, couleur: pt.couleur, total: u.length, faits: f,
               prochaine: u.some(function(c){ return c.etat === "prochaine"; }) };
    }).filter(function(x){ return x.total; });
    var proch = reste.filter(function(x){ return x.c.etat === "prochaine"; })[0];
    r.prochaine = proch ? proch.c : null;
    r.aToi = reste.filter(function(x){ return (x.c.qui === "toi" || x.c.qui === "ensemble") && libre(x.c) && x.c.etat !== "usage"; })
                  .map(function(x){ return { c: x.c, pt: x.pt }; });
    var claudePeut = reste.some(function(x){ return x.c.qui === "claude" && libre(x.c) && (x.c.etat === "prochaine" || x.c.etat === "afaire"); });
    var sMin = 0, sMax = 0, inconnues = 0;
    reste.forEach(function(x){ if (x.c.duree){ sMin += x.c.duree[0]; sMax += x.c.duree[1]; } else if (!x.c.jours) inconnues++; });
    r.resteMax = sMax; r.resteN = reste.length;
    r.sessions = sMax ? (demi(sMin) === demi(sMax) ? demi(sMin) : demi(sMin) + " to " + demi(sMax)) : ""; r.inconnues = inconnues;
    if (!reste.length) r.statut = ["fini", "Finished"];
    else if (claudePeut) r.statut = ["cours", "Claude is on it"];
    else if (r.aToi.length) r.statut = ["toi", "Waiting for you"];
    else r.statut = ["attente", "On hold"];
    return r;
  }

  function vignette(r){
    var init = (r.nom || "?").split(/[\s·]+/).filter(Boolean).slice(0, 2).map(function(m){ return m.charAt(0).toUpperCase(); }).join("");
    var style = r.fond ? ' style="background-image:url(\'' + esc(r.fond) + '\')"' : "";
    return '<span class="vignette"' + style + ' aria-hidden="true">' + (r.fond ? "" : esc(init)) + '</span>';
  }

  function parcours(r){
    if (!r.parties || !r.parties.length) return '<div class="parcours-vide">No work item declared.</div>';
    return '<div class="parcours" role="img" aria-label="' + esc(r.parties.map(function(x){ return x.nom + ": " + x.faits + " work items done out of " + x.total; }).join(", ")) + '">' +
      r.parties.map(function(x){
        var pc = x.total ? x.faits / x.total * 100 : 0;
        var bal = x.prochaine ? '<span class="balise" style="left:' + Math.max(4, Math.min(96, pc)).toFixed(1) + '%"></span>' : "";
        return '<div class="troncon" style="flex-grow:' + x.total + '"><div class="lib"><span>' + esc(x.nom) + '</span><b>' + x.faits + '/' + x.total + '</b></div>' +
          '<div class="piste"><i style="width:' + pc.toFixed(1) + '%;--c:' + esc(x.couleur || "#6b2fb3") + '"></i>' + bal + '</div></div>';
      }).join("") + '</div>';
  }

  function poignee(){ return '<span class="poignee" aria-hidden="true" title="Drag to move">' + ico("poignee", 14) + '</span>'; }
  function liProjet(r, cache){
    return '<li class="pj' + (cache ? ' cache' : '') + '" data-cle="p:' + esc(r.id) + '">' + (tri === "moi" ? poignee() : '');
  }

  function ligneProjet(r, cache){
    if (r.erreur) {
      return liProjet(r, cache) + '<a class="projet" draggable="false" href="' + lien(r.id) + '">' + vignette(r) +
        '<div class="ident"><h3>' + esc(r.nom) + '</h3><p>' + esc(r.erreur) + '</p><div class="meta"><span class="statut erreur">Tracking unreadable</span></div></div>' +
        '<div class="parcours-vide">Ask Claude to fix this project\'s tracking file.</div><div class="avance"><b>–</b></div><div class="suite"></div><div class="rythme-pj"></div></a></li>';
    }
    var maj = r.majLe ? "Updated " + esc(r.majLe) : "Update date missing";
    if (r.age != null && r.age > 7) maj = '<span class="perime">' + maj + ', ' + r.age + ' days ago</span>';
    var suite = [];
    if (r.prochaine) suite.push('<div><span class="claude">' + ico("claude") + '</span><span class="txt"><em>Next:</em> ' + esc(r.prochaine.nom) + '</span></div>');
    if (r.aToi.length) suite.push('<div><span class="moi">' + ico("toi") + '</span><span class="txt"><em>Waiting for you:</em> ' + r.aToi.length + ' work item' + (r.aToi.length > 1 ? 's' : '') + ', including “' + esc(r.aToi[0].c.nom) + '”</span></div>');
    if (r.sessions) suite.push('<div><span class="claude">' + ico("sablier") + '</span><span class="txt"><em>Left:</em> ' + r.sessions + ' work session' + (r.sessions === "1" ? "" : "s") + (r.inconnues ? ', plus ' + r.inconnues + ' with unknown duration' : '') + '</span></div>');
    if (!suite.length) suite.push('<div><span class="claude">' + ico("claude") + '</span><span class="txt">Nothing planned.</span></div>');
    return liProjet(r, cache) + '<a class="projet" draggable="false" href="' + lien(r.id) + '" aria-label="' + esc(r.nom + ", " + r.pct + "% of work items done, " + r.statut[1] + ". Open its page.") + '">' + vignette(r) +
      '<div class="ident"><h3>' + esc(r.nom) + '</h3><p>' + esc(r.resume) + '</p><div class="meta"><span class="statut ' + r.statut[0] + '">' + r.statut[1] + '</span><span>' + maj + '</span></div></div>' +
      parcours(r) +
      '<div class="avance"><b>' + r.pct + '<small>%</small></b><span>' + r.faits + ' of ' + r.total + ' work items</span></div>' +
      '<div class="suite">' + suite.join("") + '</div>' + mini(r) + '</a></li>';
  }

  function mini(r){
    var max = 1, jours = [];
    for (var i = JOURS_MINI - 1; i >= 0; i--){ var k = cle(ilYa(i)), n = r.parJour[k] || 0; jours.push([k, n, i < 7]); if (n > max) max = n; }
    var titre = r.sem + " work item" + (r.sem === 1 ? "" : "s") + " done in the last 7 days, " + r.semAvant + " in the 7 days before";
    var comp = "";
    if (r.semAvant && r.sem >= r.semAvant * 1.15) comp = ' <span class="vite">' + (r.sem >= r.semAvant * 2 ? "× " + nombre(r.sem / r.semAvant) : "+" + Math.round((r.sem / r.semAvant - 1) * 100) + "%") + '</span>';
    else if (r.semAvant && r.sem <= r.semAvant * 0.85) comp = ' <span class="lent">−' + Math.round((1 - r.sem / r.semAvant) * 100) + '%</span>';
    return '<div class="rythme-pj" title="' + esc(titre) + '"><div class="rt"><span>Done per day</span><span>14 d</span></div>' +
      '<div class="mini" aria-hidden="true">' + jours.map(function(j){
        return '<i class="' + (j[1] ? (j[2] ? "recent" : "") : "zero") + '" style="height:' + (j[1] ? Math.max(8, Math.round(j[1] / max * 100)) : 0) + '%" title="' + esc(jj(j[0]) + ": " + j[1]) + '">' + (j[1] ? '<b>' + j[1] + '</b>' : '') + '</i>';
      }).join("") + '</div>' +
      '<span class="vit"><b>+' + r.sem + '</b> in 7 d · before ' + r.semAvant + comp + '</span></div>';
  }


  // Snapshot of the day kept by the browser, to compare the total and what waits for you from one day to the next.
  function historique(photo){
    var h = {};
    try { h = JSON.parse(localStorage.getItem(HISTO_CLE) || "{}") || {}; } catch (e) { h = {}; }
    var k = cle(auj); h[k] = photo;
    var cles = Object.keys(h).sort(); while (cles.length > 400) delete h[cles.shift()];
    try { localStorage.setItem(HISTO_CLE, JSON.stringify(h)); } catch (e) {}
    // Comparison point: the most recent snapshot at least 7 days old, otherwise the oldest one available before today.
    var avant = Object.keys(h).filter(function(x){ return x < k; }).sort();
    var limite = cle(ilYa(7)), ref = avant.filter(function(x){ return x <= limite; }).pop() || avant[0];
    return ref ? { jour: ref, photo: h[ref] } : null;
  }
  function ecart(n, bonSiHausse, unite){
    if (n === 0) return '<span>=</span>';
    var bon = bonSiHausse ? n > 0 : n < 0;
    return '<span class="' + (bon ? "plus-v" : "plus-t") + '">' + (n > 0 ? "+" : "−") + Math.abs(n) + (unite || "") + '</span>';
  }

  function rythme(lus){
    var jours = [], max = 1, tot7 = 0, tot7a = 0;
    for (var i = JOURS_RYTHME - 1; i >= 0; i--){
      var k = cle(ilYa(i)), n = 0, det = [];
      lus.forEach(function(r){ var v = r.parJour[k] || 0; if (v){ n += v; det.push(r.nom + " " + v); } });
      jours.push({ k: k, n: n, det: det, recent: i < 7 }); if (n > max) max = n;
      if (i < 7) tot7 += n; else if (i < 14) tot7a += n;
    }
    var sansDate = lus.reduce(function(a, r){ return a + r.sansDate; }, 0);
    var comp = "";
    if (tot7a && tot7 >= tot7a * 1.15) comp = ' <span class="vite">' + (tot7 >= tot7a * 2 ? "× " + nombre(tot7 / tot7a) : "+" + Math.round((tot7 / tot7a - 1) * 100) + "%") + '</span>';
    else if (tot7a && tot7 <= tot7a * 0.85) comp = ' <span class="lent">−' + Math.round((1 - tot7 / tot7a) * 100) + '%</span>';
    var h = '<section class="rythme" aria-labelledby="rythme-t"><div class="rythme-tete"><h2 id="rythme-t">Work items done per day</h2>' +
      '<p><b>' + tot7 + '</b> in the last 7 days · ' + tot7a + ' in the 7 before' + comp + '</p></div>';
    if (!jours.some(function(j){ return j.n; })) return h + '<p class="vide-txt">No dated work item in the last ' + JOURS_RYTHME + ' days.</p></section>';
    h += '<div class="barres" role="img" aria-label="' + esc("Work items done per day over " + JOURS_RYTHME + " days: " + jours.filter(function(j){ return j.n; }).map(function(j){ return jj(j.k) + " " + j.n; }).join(", ")) + '">' +
      jours.map(function(j){
        var d = new Date(+j.k.slice(0, 4), +j.k.slice(5, 7) - 1, +j.k.slice(8, 10));
        var t = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) + ": " + j.n + " work item" + (j.n === 1 ? "" : "s") + (j.det.length ? " (" + j.det.join(", ") + ")" : "");
        return '<span class="' + (j.n ? (j.recent ? "recent" : "") : "vide") + '" style="height:' + (j.n ? Math.max(6, Math.round(j.n / max * 100)) : 0) + '%" title="' + esc(t) + '">' + (j.n ? '<b>' + j.n + '</b>' : '') + '</span>';
      }).join("") + '</div>' +
      '<div class="axe"><span>' + jj(jours[0].k) + '</span><span>last 7 days in dark</span><span>today</span></div>';
    return h + '</section>';
  }

  function quandTxt(c){
    if (c.duree){ var a = c.duree[0], b = c.duree[1]; if (b < 1) return "< 1 session"; return (a === b ? nombre(a) : nombre(a) + " to " + nombre(b)) + " session" + (b > 1 ? "s" : ""); }
    if (c.jours){ var j = c.jours; return (j[0] === j[1] ? j[0] : j[0] + " to " + j[1]) + " day" + (j[1] > 1 ? "s" : ""); }
    return "unknown duration";
  }

  // List orders. "My order": arranged by hand, with separators; the others sort inside each group,
  // except "Status", which groups by status.
  var TRIS = [["moi", "My order", "Your own arrangement, with your separators"],
              ["avance", "Progress", "Most advanced first, inside each group"],
              ["statut", "Status", "Grouped by status, most advanced first"],
              ["rythme", "Pace", "Most work items done in the last 7 days first, inside each group"],
              ["reste", "Work left", "Fewest sessions left first, inside each group"]];
  var tri = "moi";
  try { tri = localStorage.getItem(TRI_CLE) || "moi"; } catch (e) {}
  if (!TRIS.some(function(t){ return t[0] === tri; })) tri = "moi";
  var donnees = [], ouvertTout = false;

  // ---- Arrangement: { ordre: ["p:<project>", "s:<separator>", …], seps: { <id>: { nom, couleur, plie } } } ----

    var faits = lus.reduce(function(a, r){ return a + r.faits; }, 0), total = lus.reduce(function(a, r){ return a + r.total; }, 0);
    var attend = []; lus.forEach(function(r){ r.aToi.forEach(function(x){ attend.push({ r: r, c: x.c, pt: x.pt }); }); });
    attend.sort(function(a, b){ return (b.c.etat === "attente") - (a.c.etat === "attente"); });
    var perimes = lus.filter(function(r){ return r.age != null && r.age > 7; }).length;
    var avancent = lus.filter(function(r){ return r.statut[0] === "cours"; }).length;

    var h = [];
    h.push('<section class="ouverture"><div><h1><span>Where things stand</span><span>across all projects</span></h1>');
    h.push('<p class="resume"><b>' + lus.length + ' tracked project' + (lus.length > 1 ? 's' : '') + '</b>, ' + avancent + ' where Claude can move on alone. ' +
      (attend.length ? '<span class="t">' + attend.length + ' work item' + (attend.length > 1 ? 's' : '') + ' waiting for you</span>, listed below.' : 'Nothing is waiting for you.') +
      (perimes ? ' <span class="t">' + perimes + ' tracking page' + (perimes > 1 ? 's are' : ' is') + ' more than 7 days old.</span>' : '') + '</p></div>');
    var pct = total ? Math.round(faits / total * 100) : 0;
    var photo = { pct: pct, f: faits, t: total, a: attend.length, p: {} };
    lus.forEach(function(r){ photo.p[r.id] = [r.faits, r.total, r.aToi.length]; });
    var ref = historique(photo), depuis = ref ? " since " + jj(ref.jour) : "";
    var sem = lus.reduce(function(a, r){ return a + r.sem; }, 0);
    var eFaits = '<em>' + ecart(sem, true) + ' in 7 days' + (ref && ref.photo.t !== total ? ' · total ' + ecart(total - ref.photo.t, true).replace(/plus-[vt]/, "") : '') + '</em>';
    var ePct = ref ? '<em>' + ecart(pct - ref.photo.pct, true, " pt" + (Math.abs(pct - ref.photo.pct) > 1 ? "s" : "")) + depuis + '</em>' : '<em>tracking starts today</em>';
    var eAtt = ref ? '<em>' + ecart(attend.length - ref.photo.a, false) + depuis + '</em>' : '<em>&nbsp;</em>';
    h.push('<div class="cote"><div class="bilan"><div><b>' + pct + '%</b><small>of work items done</small>' + ePct + '</div><div><b>' + faits + ' / ' + total + '</b><small>work items, all projects</small>' + eFaits + '</div><div><b class="t">' + attend.length + '</b><small>waiting for you</small>' + eAtt + '</div></div>' + rythme(lus) + '</div></section>');

    h.push('<section class="sec" id="projets"><div id="zone-projets"></div>');
    h.push('<p class="note">Your arrangement (order, separators, folded groups) is kept by this browser; a project added to the menu appears at the bottom of the list. Percentage: work items done out of all the project\'s work items, excluding optional ones, not weighted by duration. Each stretch of the course is a part of the project; the ring marks the part where Claude\'s next step is. Small bars: work items done each day over 14 days, from the date noted on each finished work item (last 7 days in dark).' +
      (function(){ var n = lus.reduce(function(a, r){ return a + r.sansDate; }, 0); return n ? ' ' + n + ' finished work item' + (n > 1 ? 's have' : ' has') + ' no date and ' + (n > 1 ? 'do' : 'does') + ' not count in the pace.' : ''; })() + '</p></section>');

    h.push('<section class="sec" id="attend"><div class="sec-tete"><h2>Waiting for you</h2><p>Work items that are yours, or to do together, that nothing else blocks.</p></div>');
    if (!attend.length) h.push('<div class="attend"><p style="padding:14px 18px;color:var(--encre-3)">Nothing right now.</p></div>');
    else {
      var vus = ouvertTout ? attend : attend.slice(0, 10);
      h.push('<div class="attend">' + vus.map(function(x){
        return '<a class="att" href="' + lien(x.r.id) + '"><span class="pj">' + esc(x.r.nom) + '</span><b>' + esc(x.c.nom) + (x.c.qui === "ensemble" ? '<span class="ens">with Claude</span>' : '') + '</b><span class="d">' + esc(quandTxt(x.c)) + '</span>' +
          (x.c.detail ? '<p>' + esc(x.c.detail) + '</p>' : '') + '</a>';
      }).join("") + (attend.length > 10 ? '<button type="button" class="plus" id="plus">' + (ouvertTout ? 'Show the first 10' : 'See all ' + attend.length + ' work items') + '</button>' : '') + '</div>');
    }
    h.push('</section>');

    h.push('<section class="sec" id="hors"><div class="sec-tete"><h2>Without a tracking page</h2><p>Projects without a <code>suivi.js</code> file: status noted by hand' + (hors.majLe ? ', as of ' + esc(hors.majLe) : '') + '.</p></div>');
    if (!(hors.projets || []).length) h.push('<p class="note">None.</p>');
    else h.push('<table><thead><tr><th scope="col">Project</th><th scope="col">Status</th><th scope="col">Where it stands</th><th scope="col">Date of the info</th></tr></thead><tbody>' +
      hors.projets.map(function(x){ return '<tr><td>' + esc(x.nom) + '</td><td><span class="statut ' + esc(x.classe || "attente") + '">' + esc(x.statut) + '</span></td><td>' + esc(x.note) + '</td><td class="date">' + esc(x.date) + '</td></tr>'; }).join("") + '</tbody></table>');
    h.push('</section>');

    h.push('<p class="pied">Everything is recomputed at each opening from the <code>suivi.js</code> file of each project listed in <code>projects/index.js</code>: nothing is copied here. Only the "Without a tracking page" list is maintained by hand, in <code>projects/untracked.js</code>. The "since" differences compare against a snapshot of the figures that this browser keeps each time the page is opened (the most recent one at least 7 days old); the pace, on the other hand, comes from the work items\' dates. Click a project to open its detailed page.</p>');

    app.className = ""; app.innerHTML = h.join("");
    rendreProjets();
    var plus = document.getElementById("plus");
    if (plus) plus.addEventListener("click", function(){ ouvertTout = !ouvertTout; rendre(); var p2 = document.getElementById("plus"); if (p2) p2.focus(); });
  }
})();
</script>
</body>
</html>
